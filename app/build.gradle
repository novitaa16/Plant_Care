plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.plantcare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.plantcare'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
